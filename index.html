<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나비를 기억하며</title>
<meta name="description" content="나비 2011~2026.08.09 · 함께해 줘서 고마웠어.">

<meta property="og:title" content="나비를 기억하며">
<meta property="og:description" content="2011~2026.08.09 · 함께해 줘서 고마웠어.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{--bg:#f7f4ef;--card:#fffdfa;--ink:#2b2724;--sub:#8a817a;--line:#e7e1d8;--accent:#2b2724;--chip:#efe9e0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .wrap{max-width:540px;margin:0 auto;padding:0 16px 80px}
  [hidden]{display:none!important}

  header.hero{text-align:center;padding:56px 0 32px}
  .hero .mark{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;overflow:hidden;border:1px solid var(--line)}
  .hero .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .hero h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:28px;letter-spacing:-.01em}
  .hero .life{margin-top:6px;color:var(--sub);font-size:12px;letter-spacing:.06em}
  .hero .note{margin-top:10px;font-family:"Gowun Batang",serif;font-size:15px;color:#5d5650;line-height:1.7}

  .bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 24px;padding:0 16px}
  .row{display:flex;align-items:center;gap:10px;min-height:52px}
  .row + .row{min-height:48px;padding-bottom:4px}

  /* 랜덤 바 */
  .hint{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hint svg{flex:none}
  .btn{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:500;padding:8px 12px;border-radius:999px;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .link{flex:none;border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}

  /* 전체 사진 바 */
  .back{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-8px;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--ink)}
  .back:hover{background:var(--chip)}
  .title{font-weight:600;font-size:15px}
  .count{margin-left:auto;color:var(--sub);font-size:13px}
  .years-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:4px}
  .years-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .years-row::-webkit-scrollbar{display:none}
  .years-row{cursor:grab;user-select:none;-webkit-user-select:none;scroll-behavior:auto}
  .years-row.dragging{cursor:grabbing}
  .years-row.dragging .chip{pointer-events:none}
  .years-row.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
  .years-row.fade-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent)}
  .years-row.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
  .expand{flex:none;width:30px;height:30px;border:0;background:none;border-radius:50%;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .expand:hover{background:var(--chip);color:var(--ink)}
  .expand svg{transition:transform .2s}
  .row.open{align-items:flex-start;padding-top:8px;padding-bottom:10px}
  .row.open .years-wrap{align-items:flex-start}
  .row.open .years-row{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
  .row.open .expand svg{transform:rotate(180deg)}
  .chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:500 13px/1 "Noto Sans KR",sans-serif;padding:8px 13px;border-radius:999px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff}
  .chip .n{opacity:.55;margin-left:4px;font-weight:400}
  .sort{flex:none;display:flex;background:var(--chip);border-radius:999px;padding:3px}
  .sort button{border:0;background:transparent;font:500 12px/1 "Noto Sans KR",sans-serif;color:var(--sub);padding:7px 10px;border-radius:999px;cursor:pointer}
  .sort button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .year-divider{display:flex;align-items:center;gap:12px;margin:8px 0 18px;color:var(--sub);font-family:"Gowun Batang",serif;font-size:15px}
  .year-divider::before,.year-divider::after{content:"";flex:1;height:1px;background:var(--line)}

  article.post{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:28px}
  .post .ph{position:relative;display:block;width:100%;background:#e9e3da;cursor:zoom-in;border:0;padding:0}
  .post .ph{background-size:cover;background-position:center}
  .post .ph img,.post .ph video{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s ease}
  .post .ph img.ld,.post .ph video.ld{opacity:1}
  .mwrap{position:relative}
  .num{position:absolute;top:10px;left:10px;background:rgba(20,18,16,.62);color:#fff;font:600 12px/1 "Noto Sans KR",sans-serif;padding:6px 8px;border-radius:6px;pointer-events:none}
  .post .meta{padding:14px 16px 16px}
  .post time{display:block;font-size:13px;color:var(--sub);letter-spacing:.02em}
  .post p{margin-top:8px;font-family:"Gowun Batang",serif;font-size:16px;line-height:1.7;white-space:pre-line}

  /* 마무리 카드 */
  .endcard{text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:32px 20px 24px;margin-bottom:28px}
  .endcard h3{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700}
  .endcard .desc{margin-top:10px;color:#5d5650;font-size:14px;line-height:1.75}
  .endcard .primary{display:block;width:100%;margin-top:20px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:500;padding:14px;border-radius:12px;cursor:pointer}
  .endcard .link{margin-top:14px}

  .empty{text-align:center;color:var(--sub);padding:60px 0}

  .totop{position:fixed;right:max(16px,calc(50% - 270px - 64px));bottom:24px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:6}
  .totop.on{opacity:1;transform:none;pointer-events:auto}
  .lb{position:fixed;inset:0;background:rgba(20,18,16,.94);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
  .lb.on{display:flex}
  .lb img,.lb video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
</style>
</head>

<div class="wrap">
  <header class="hero" id="hero">
    <div class="mark"><img src="photos/avatar.webp" alt=""></div>
    <h1>나비</h1>
    <div class="life">2011~2026.08.09</div>
    <div class="note">함께해 줘서 고마웠어.</div>
  </header>

  <!-- ① 랜덤 보기 (기본) -->
  <section id="randomView">
    <div class="bar">
      <div class="row">
        <span class="hint"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>올 때마다 다른 사진</span>
        <button type="button" class="btn" id="shuffleBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>새로 섞기</button>
        <button type="button" class="link" data-go="all">전체 사진</button>
      </div>
    </div>
    <main id="randomFeed"></main>
  </section>

  <!-- ③ 전체 사진 보기 -->
  <section id="allView" hidden>
    <div class="bar">
      <div class="row">
        <button type="button" class="back" data-go="random" aria-label="랜덤 보기로 돌아가기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="title">전체 사진</span>
        <span class="count" id="allCount"></span>
      </div>
      <div class="row">
        <div class="years-wrap">
          <div class="years-row" id="years" role="group" aria-label="연도"></div>
          <button type="button" class="expand" id="expandYears" aria-expanded="false" aria-label="연도 모두 보기" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="sort" role="group" aria-label="정렬">
          <button type="button" data-sort="new">최신순</button>
          <button type="button" data-sort="old">오래된순</button>
        </div>
      </div>
    </div>
    <main id="allFeed"></main>
  </section>
</div>

const BATCH = 20;
const NODATE = "nodate";
const byId = Object.fromEntries(PHOTOS.map(p => [p.id, p]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const yearOf = p => p.date ? p.date.slice(0,4) : NODATE;
const fmt = d => { if(!d) return "날짜 미정"; if(d.length===4) return `${d}년`; const [y,m,day] = d.split("-").map(Number); return `${y}년 ${m}월 ${day}일`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hero = document.getElementById("hero");
const listTop = () => hero.offsetTop + hero.offsetHeight;
const goListTop = () => { if(scrollY > listTop()) scrollTo({top:listTop(), behavior:"instant"}); };

/* 영상: 화면에 보일 때만 재생 */
const vio = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if(e.isIntersecting) v.play().catch(()=>{}); else v.pause();
}), {threshold: .4});
const watchVideos = root => root.querySelectorAll("video:not([data-w])").forEach(v => { v.dataset.w = 1; vio.observe(v); });

const base = p => p.src.replace(/\.(jpg|mp4)$/, "");
const imgSrc = p => `${base(p)}-1080.webp`;
// 이미지·영상이 준비되면 흐린 미리보기 위로 부드럽게 나타나게
const markLoaded = el => el.classList.add("ld");
document.addEventListener("load", e => { if(e.target.tagName==="IMG" && e.target.closest(".ph")) markLoaded(e.target); }, true);
document.addEventListener("loadeddata", e => { if(e.target.tagName==="VIDEO") markLoaded(e.target); }, true);
// 다음 묶음 사진을 미리 받아두기 (화면이 한가할 때)
const idle = window.requestIdleCallback || (f => setTimeout(f, 300));
function prefetch(list){
  idle(() => list.forEach(p => {
    if(p.type==="img"){ const i = new Image(); i.src = imgSrc(p); }
  }));
}

function postHTML(p, eager){
  const ratio = Math.max(p.w/p.h, 4/5);
  const media = p.type==="video"
    ? `<video src="${p.src}" muted loop playsinline preload="${eager ? "auto" : "metadata"}"></video>`
    : `<img src="${imgSrc(p)}" alt="${fmt(p.date)} 사진" ${eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"'} decoding="async">`;
  return `<article class="post" data-id="${p.id}">
    <div class="mwrap"><button type="button" class="ph" data-id="${p.id}" style="aspect-ratio:${ratio};background-image:url(${p.lq})" aria-label="${p.label||p.id}번 크게 보기">${media}<span class="num">${p.label||p.id}</span></button></div>
    <div class="meta"><time datetime="${p.date}">${fmt(p.date)}</time>${p.text ? `<p>${esc(p.text)}</p>` : ""}</div>
  </article>`;
}

/* ───────── 본 사진 기록 (같은 브라우저 안에서만) ───────── */
let seen = new Set();
try { (JSON.parse(store.get("nabi-seen")) || []).forEach(id => byId[id] && seen.add(id)); } catch(e){}
let saveTimer = null;
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting){ seen.add(+e.target.dataset.id); io.unobserve(e.target); }
  });
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { store.set("nabi-seen", JSON.stringify([...seen])); updateRemain(); }, 400);
}, {threshold: .6});

/* ───────── ① 랜덤 보기 ───────── */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 연도를 돌아가며 한 장씩: 처음 몇십 장 안에 모든 연도가 고르게 섞이도록
// 날짜 미정 사진은 따로 묶지 않고 결과 속 무작위 위치에 흩어 넣음
function balanced(list){
  const groups = {}, loose = [];
  list.forEach(p => p.date ? (groups[yearOf(p)] ||= []).push(p) : loose.push(p));
  Object.values(groups).forEach(shuffle);
  const out = [];
  let keys = Object.keys(groups);
  while(keys.length){
    shuffle(keys).forEach(k => out.push(groups[k].pop()));
    keys = keys.filter(k => groups[k].length);
  }
  loose.forEach(p => out.splice(Math.floor(Math.random()*(out.length+1)), 0, p));
  return out;
}
const R = { order: [], shown: 0, scroll: null };
const randomFeed = document.getElementById("randomFeed");

function buildOrder(){
  if(seen.size >= PHOTOS.length){ seen.clear(); store.set("nabi-seen","[]"); }   // 다 봤으면 처음부터
  const unseen = PHOTOS.filter(p => !seen.has(p.id));
  const already = PHOTOS.filter(p => seen.has(p.id));
  R.order = [...balanced(unseen), ...balanced(already)];   // 안 본 사진 먼저
  R.shown = 0;
  randomFeed.innerHTML = "";
  showMore();
}
function remainCount(){ return PHOTOS.length - seen.size; }
function endCardHTML(){
  const done = R.shown >= R.order.length;
  const remain = remainCount();
  const desc = remain > 0
    ? `아직 못 본 사진이 <b class="remain">${remain}</b>장 남았어요.<br>다음에 오면 다른 사진이 나와요.`
    : `모든 사진을 다 봤어요.<br>다음에 오면 처음부터 새로 섞여요.`;
  return `<div class="endcard" id="endcard">
    <h3>${done ? "나비의 사진을 모두 봤어요" : `오늘의 나비 ${R.shown}장`}</h3>
    <p class="desc">${desc}</p>
    ${done ? `<button type="button" class="primary" data-act="reshuffle">새로 섞어서 보기</button>`
           : `<button type="button" class="primary" data-act="more">${Math.min(BATCH, R.order.length - R.shown)}장 더 보기</button>`}
    <button type="button" class="link" data-go="all">전체 사진 보기</button>
  </div>`;
}
function updateRemain(){
  const el = document.querySelector("#endcard .remain");
  if(el) el.textContent = remainCount();
}
function showMore(){
  document.getElementById("endcard")?.remove();
  const next = R.order.slice(R.shown, R.shown + BATCH);
  R.shown += next.length;
  const first = R.shown === next.length;
  randomFeed.insertAdjacentHTML("beforeend", next.map((p,i) => postHTML(p, first && i < 2)).join("") + endCardHTML());
  prefetch(R.order.slice(R.shown, R.shown + BATCH));
  randomFeed.querySelectorAll("article.post:not([data-obs])").forEach(a => { a.dataset.obs = 1; io.observe(a); });
  watchVideos(randomFeed);
}
document.getElementById("shuffleBtn").addEventListener("click", () => { buildOrder(); goListTop(); });
randomFeed.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  if(b.dataset.act==="more") showMore();
  if(b.dataset.act==="reshuffle"){ buildOrder(); goListTop(); }
});

/* ───────── ③ 전체 사진 보기 ───────── */
// 정렬: 직접 고른 적이 있으면 모든 탭에 유지, 아니면 오래된순
let userSort = store.get("nabi-sort-v2");
if(userSort!=="new" && userSort!=="old") userSort = null;
const A = { year: "all", scroll: null, tabScroll: {} };
const sortOf = tab => userSort || "old";
const allFeed = document.getElementById("allFeed");
const yearsEl = document.getElementById("years");
document.getElementById("allCount").textContent = `${PHOTOS.length}장`;

function syncSortUI(){
  const cur = sortOf(A.year);
  document.querySelectorAll(".sort button").forEach(x => x.setAttribute("aria-pressed", x.dataset.sort===cur));
}
function buildYears(){
  const counts = {};
  PHOTOS.forEach(p => { const y = yearOf(p); counts[y] = (counts[y]||0)+1; });
  const ys = Object.keys(counts).filter(y => y!==NODATE).sort((a,b) => b-a);
  const opts = [["all","전체",PHOTOS.length], ...ys.map(y => [y,y,counts[y]])];
  if(counts[NODATE]) opts.push([NODATE,"날짜 미정",counts[NODATE]]);
  yearsEl.innerHTML = opts.map(([v,l,n]) =>
    `<button type="button" class="chip" data-year="${v}" aria-pressed="${A.year===v}">${l}<span class="n">${n}</span></button>`).join("");
  requestAnimationFrame(updateFade);
}
function renderAll(){
  const list = PHOTOS.filter(p => A.year==="all" || yearOf(p)===A.year);
  // ord: 시간 순서 (연도만 아는 사진은 그 해 안에 끼워 넣은 위치)
  list.sort((a,b) => sortOf(A.year)==="new" ? b.ord-a.ord : a.ord-b.ord);
  let html = "", last = null;
  list.forEach(p => {
    const y = yearOf(p);
    if(A.year==="all" && y!==last){ html += `<div class="year-divider">${y===NODATE ? "날짜 미정" : y}</div>`; last = y; }
    html += postHTML(p);
  });
  allFeed.innerHTML = html || '<div class="empty">사진이 없어요</div>';
  watchVideos(allFeed);
}
/* 연도 탭: 넘치면 끝을 흐리게 + 펼치기 버튼 */
const expandBtn = document.getElementById("expandYears");
const yearsRowEl = yearsEl.closest(".row");
function updateFade(){
  const open = yearsRowEl.classList.contains("open");
  const over = yearsEl.scrollWidth > yearsEl.clientWidth + 1;
  expandBtn.hidden = !over && !open;
  yearsEl.classList.toggle("fade-r", !open && over && yearsEl.scrollLeft + yearsEl.clientWidth < yearsEl.scrollWidth - 2);
  yearsEl.classList.toggle("fade-l", !open && over && yearsEl.scrollLeft > 2);
}
yearsEl.addEventListener("scroll", updateFade, {passive:true});
// PC: 마우스 휠과 드래그로도 가로 스크롤
yearsEl.addEventListener("wheel", e => {
  if(yearsRowEl.classList.contains("open") || yearsEl.scrollWidth <= yearsEl.clientWidth) return;
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ yearsEl.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive:false});
let drag = null;
yearsEl.addEventListener("pointerdown", e => { if(e.pointerType !== "mouse") return; drag = {x:e.clientX, left:yearsEl.scrollLeft, moved:false}; });
addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = e.clientX - drag.x;
  if(Math.abs(dx) > 4){ drag.moved = true; yearsEl.classList.add("dragging"); }
  if(drag.moved) yearsEl.scrollLeft = drag.left - dx;
});
addEventListener("pointerup", () => { if(drag?.moved) setTimeout(() => yearsEl.classList.remove("dragging"), 0); drag = null; });
yearsEl.addEventListener("click", e => { if(yearsEl.classList.contains("dragging")){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
addEventListener("resize", updateFade);
expandBtn.addEventListener("click", () => {
  const open = yearsRowEl.classList.toggle("open");
  expandBtn.setAttribute("aria-expanded", open);
  expandBtn.setAttribute("aria-label", open ? "연도 접기" : "연도 모두 보기");
  if(!open) yearsEl.querySelector('[aria-pressed="true"]')?.scrollIntoView({inline:"nearest", block:"nearest"});
  updateFade();
});

yearsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-year]"); if(!b) return;
  const next = b.dataset.year; if(next===A.year) return;
  A.tabScroll[A.year] = scrollY;
  A.year = next; buildYears(); renderAll(); syncSortUI();
  if(A.tabScroll[next] != null) scrollTo({top:A.tabScroll[next], behavior:"instant"}); else goListTop();
});
document.querySelector(".sort").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if(!b) return;
  userSort = b.dataset.sort; store.set("nabi-sort-v2", userSort);
  A.tabScroll = {};   // 순서가 바뀌면 저장된 위치는 초기화
  syncSortUI(); renderAll(); goListTop();
});

/* ───────── 화면 전환 ───────── */
const views = { random: document.getElementById("randomView"), all: document.getElementById("allView") };
let mode = "random", allBuilt = false;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(!b) return;
  const to = b.dataset.go; if(to===mode) return;
  (mode==="random" ? R : A).scroll = scrollY;
  views[mode].hidden = true; views[to].hidden = false; mode = to;
  if(to==="all" && !allBuilt){ buildYears(); renderAll(); syncSortUI(); allBuilt = true; }
  const saved = (to==="random" ? R : A).scroll;
  if(saved != null) scrollTo({top:saved, behavior:"instant"}); else goListTop();
});

/* ───────── 공통: 크게 보기 · 맨 위로 ───────── */
const lb = document.getElementById("lb");
document.addEventListener("click", e => {
  const b = e.target.closest(".ph"); if(!b) return;
  const p = byId[b.dataset.id];
  lb.innerHTML = p.type!=="video" ? `<img src="${imgSrc(p)}" alt="">`
    : `<video src="${p.src}" muted loop playsinline autoplay></video>`;
  lb.classList.add("on");
});
